<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005293">
  <title>Sol</title>
  <meta name="description" content="Sol – svensk ordlista">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- iPhone/iPad: home-screen icon, name and full-screen mode (iOS ignores manifest icons). -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Sol">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f4f6f8; --fg: #1a1f24; --muted: #6b7680;
      --card: #ffffff; --back: #005293; --back-fg: #ffffff; --accent: #fecc02;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161b; --fg: #e8edf2; --muted: #8a96a2; --card: #1d252d; --back: #0b4a80; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    header { display: flex; gap: 8px; }
    select { flex: 1; min-width: 0; }
    select, button {
      font: inherit; color: inherit; background: var(--card);
      border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
      border-radius: 10px; padding: 10px 12px;
    }
    #status { display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font-size: .9rem; margin: 10px 2px 8px; min-height: 1.6em; }
    #reset { padding: 2px 10px; font-size: .85rem; }
    .stage { flex: 1; display: flex; perspective: 1200px; min-height: 0; }
    .card { position: relative; flex: 1; transform-style: preserve-3d;
      transition: transform .4s ease; cursor: pointer; user-select: none; }
    .card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; padding: 56px 24px;
      text-align: center; box-shadow: 0 6px 24px rgb(0 0 0 / .12); }
    .front { background: var(--card); }
    .back { background: var(--back); color: var(--back-fg); transform: rotateY(180deg); }
    .tag { position: absolute; top: 16px; left: 18px; text-align: left; white-space: pre-line;
      font-size: .85rem; font-weight: 600; line-height: 1.35; opacity: .65; }
    .word { font-size: clamp(1.6rem, 7.5vw, 2.6rem); font-weight: 700; overflow-wrap: anywhere; }
    .forms { display: block; font-size: .6em; font-weight: 500; opacity: .7; margin-top: .4em; }
    .hint { position: absolute; bottom: 16px; font-size: .8rem; opacity: .6; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    .controls button { padding: 14px 8px; font-size: 1rem; }
    #learnt { background: var(--accent); color: #1a1f24; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .4; }
    #install { margin-bottom: 10px; padding: 12px; font-weight: 600;
      background: var(--accent); color: #1a1f24; border-color: var(--accent); }
    #install[hidden] { display: none; }
    #showLearnt { padding: 4px 12px; font-size: .85rem; }
    dialog { border: 0; padding: 0; width: 100%; max-width: 560px; height: 100%; max-height: 100%;
      margin: 0 auto; background: var(--bg); color: var(--fg); }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    .sheet { display: flex; flex-direction: column; height: 100%; padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sheet-head h2 { font-size: 1.15rem; margin: 0; }
    #learntList { flex: 1; overflow-y: auto; margin-top: 8px; }
    .group h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: .9rem; color: var(--muted); margin: 18px 2px 8px; }
    .row { display: flex; align-items: center; gap: 10px; background: var(--card);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
    .row div { flex: 1; min-width: 0; }
    .row b { display: block; overflow-wrap: anywhere; }
    .row span { color: var(--muted); font-size: .9rem; }
    .row button, .group h3 button { padding: 4px 10px; font-size: .85rem; flex-shrink: 0; }
    .emptyMsg { color: var(--muted); text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <button id="install" hidden>⬇ Install Sol as an app</button>
  <header>
    <select id="level" aria-label="Level"></select>
    <select id="chapter" aria-label="Chapter"></select>
    <button id="shuffle" aria-label="Shuffle">🔀</button>
  </header>
  <div id="status"><span id="progress"></span><button id="showLearnt">✓ Learnt words</button></div>
  <div class="stage">
    <div class="card" id="card" role="button" aria-label="Flip card">
      <div class="face front"><div class="tag" id="frontTag"></div><div class="word" id="front"></div><div class="hint">tap to flip</div></div>
      <div class="face back"><div class="tag" id="backTag"></div><div class="word" id="back"></div></div>
    </div>
  </div>
  <div class="controls">
    <button id="prev">← Back</button>
    <button id="next">Next →</button>
    <button id="learnt">Learnt ✓</button>
  </div>

  <dialog id="learntDialog">
    <div class="sheet">
      <div class="sheet-head"><h2 id="learntTitle">Learnt words</h2><button id="closeLearnt">Close</button></div>
      <div id="learntList"></div>
    </div>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    // localStorage can be unavailable (private mode); the app still works, just without memory.
    const store = {
      get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    const chapterName = (k) => (/^\d+$/.test(k) ? `Kapitel ${k}` : k);
    const id = (level, ch, sv) => `${level}|${ch}|${sv}`;

    let data = {}, deck = [], i = 0;
    const learnt = new Set(store.get("learnt", []));

    function fillChapters() {
      const chapters = Object.keys(data[$("level").value]);
      $("chapter").innerHTML = chapters.map((k) => `<option value="${k}">${chapterName(k)}</option>`).join("");
      const saved = store.get("chapter", {})[$("level").value];
      if (chapters.includes(saved)) $("chapter").value = saved;
    }

    function shuffle(a) {
      for (let k = a.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [a[k], a[j]] = [a[j], a[k]];
      }
      return a;
    }

    // Opening a chapter shuffles it once; 🔀 reshuffles on demand.
    function buildDeck() {
      const level = $("level").value, ch = $("chapter").value;
      store.set("level", level);
      store.set("chapter", { ...store.get("chapter", {}), [level]: ch });
      deck = shuffle(data[level][ch]
        .map(([sv, en]) => ({ sv, en, id: id(level, ch, sv) }))
        .filter((c) => !learnt.has(c.id)));
      i = 0;
      render();
    }

    function render() {
      const level = $("level").value, ch = $("chapter").value;
      $("showLearnt").textContent = `✓ Learnt words (${learnt.size})`;
      $("card").classList.remove("flipped");
      const tag = `${level}\n${chapterName(ch)}`;
      $("frontTag").textContent = tag;
      ["prev", "next", "learnt"].forEach((b) => ($(b).disabled = !deck.length));
      if (!deck.length) {
        $("front").textContent = "🎉 All learnt!";
        $("progress").textContent = "0 left";
        return;
      }
      const c = deck[i];
      // "associera med (-r, -de, -t)" -> big word, forms on a smaller line below.
      const m = c.sv.match(/^(.*?)\s+(\(.*)$/);
      $("front").textContent = m ? m[1] : c.sv;
      if (m) $("front").insertAdjacentHTML("beforeend", '<span class="forms"></span>');
      if (m) $("front").lastChild.textContent = m[2];
      // Swap the answer only after the card has turned back to the front.
      setTimeout(() => { $("back").textContent = c.en; $("backTag").textContent = tag; }, 200);
      $("progress").textContent = `${i + 1} / ${deck.length}`;
    }

    $("card").onclick = () => deck.length && $("card").classList.toggle("flipped");
    $("prev").onclick = () => { i = (i - 1 + deck.length) % deck.length; render(); };
    $("next").onclick = () => { i = (i + 1) % deck.length; render(); };
    $("learnt").onclick = () => {
      learnt.add(deck[i].id);
      store.set("learnt", [...learnt]);
      deck.splice(i, 1);
      if (i >= deck.length) i = 0;
      render();
    };
    $("shuffle").onclick = () => { shuffle(deck); i = 0; render(); };

    // Learnt words list, grouped by book and chapter in book order.
    const el = (tag, text, cls) => {
      const e = document.createElement(tag);
      if (text != null) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    };
    let restoredHere = false; // a word of the open chapter was restored while the list was open

    function restore(level, ch, words) {
      words.forEach(([sv]) => learnt.delete(id(level, ch, sv)));
      store.set("learnt", [...learnt]);
      if (level === $("level").value && ch === $("chapter").value) restoredHere = true;
      renderLearnt();
    }

    function renderLearnt() {
      const list = $("learntList"), scroll = list.scrollTop;
      list.replaceChildren();
      let total = 0;
      for (const level of Object.keys(data)) {
        for (const ch of Object.keys(data[level])) {
          const words = data[level][ch].filter(([sv]) => learnt.has(id(level, ch, sv)));
          if (!words.length) continue;
          total += words.length;
          const group = el("div", null, "group");
          const head = el("h3", `${level} · ${chapterName(ch)} (${words.length})`);
          const all = el("button", "Restore all");
          all.onclick = () => confirm(`Put all ${words.length} words in ${level} ${chapterName(ch)} back into practice?`) && restore(level, ch, words);
          head.append(all);
          group.append(head);
          for (const [sv, en] of words) {
            const row = el("div", null, "row"), text = el("div");
            text.append(el("b", sv), el("span", en));
            const undo = el("button", "↩ Undo");
            undo.onclick = () => restore(level, ch, [[sv]]);
            row.append(text, undo);
            group.append(row);
          }
          list.append(group);
        }
      }
      $("learntTitle").textContent = `Learnt words (${total})`;
      if (!total) list.append(el("p", "No learnt words yet. Tap “Learnt ✓” on a card to add it here.", "emptyMsg"));
      list.scrollTop = scroll;
    }

    $("showLearnt").onclick = () => {
      restoredHere = false;
      renderLearnt();
      $("learntList").scrollTop = 0;
      $("learntDialog").showModal();
    };
    $("closeLearnt").onclick = () => $("learntDialog").close();
    $("learntDialog").onclose = () => (restoredHere ? buildDeck() : render());
    $("level").onchange = () => { fillChapters(); buildDeck(); };
    $("chapter").onchange = buildDeck;

    fetch("cards.json")
      .then((r) => r.json())
      .then((d) => {
        data = d;
        const levels = Object.keys(d);
        $("level").innerHTML = levels.map((l) => `<option>${l}</option>`).join("");
        const saved = store.get("level", null);
        if (levels.includes(saved)) $("level").value = saved;
        fillChapters();
        buildDeck();
      })
      .catch(() => { $("front").textContent = "Couldn't load cards."; });

    // Chrome only fires this when Sol can be installed and isn't installed yet. Its dialog
    // installs a real app (own icon, no browser bar), unlike "Add to Home screen > Create shortcut".
    let installPrompt = null;
    addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installPrompt = e;
      $("install").hidden = false;
    });
    $("install").onclick = () => {
      $("install").hidden = true;
      installPrompt?.prompt();
      installPrompt = null;
    };
    addEventListener("appinstalled", () => ($("install").hidden = true));

    // iPhone/iPad have no install prompt, so explain the Share-menu route instead (once dismissed, stays hidden).
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (isIOS && !standalone && !store.get("iosHintDismissed", false)) {
      $("install").textContent = "To install: tap Share ⬆︎ then “Add to Home Screen” ✕";
      $("install").hidden = false;
      $("install").onclick = () => { $("install").hidden = true; store.set("iosHintDismissed", true); };
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
